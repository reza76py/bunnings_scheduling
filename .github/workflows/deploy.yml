name: Deploy Bunnings Scheduling

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" <<'EOF'
          set -euo pipefail
          cd /var/www/bunnings_scheduling

          cat > .env <<'ENVEOF'
          DEBUG=False
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DB_NAME=bunnings_scheduling
          DB_USER=root
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=3306
          ALLOWED_HOSTS=s.rezteche.com
          CORS_ALLOWED_ORIGINS=https://s.rezteche.com
          CSRF_TRUSTED_ORIGINS=https://s.rezteche.com
          VITE_API_URL=https://s.rezteche.com
          ENVEOF

          chmod 600 .env
          bash deploy.sh
          EOF
